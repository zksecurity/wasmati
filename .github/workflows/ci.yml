name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Wide arithmetic requires a recent Node 27 nightly.
          node-version: 27.0.0-nightly20261006fcfb7ecc0b
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/blog/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix examples/blog
      - name: Check types
        run: |
          npm run check
          npm run check --prefix examples/blog
      - name: Run tests
        run: |
          npm test
          npm run test:unit
      - name: Build package
        run: npm run build
