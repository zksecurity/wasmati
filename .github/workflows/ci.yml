name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Source and example formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check

  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Wide arithmetic requires a recent Node 27 nightly.
          node-version: 27.0.0-nightly20261006fcfb7ecc0b
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/blog/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix examples/blog
      - name: Check types
        run: |
          npm run check
          npm run check --prefix examples/blog
      - name: Run tests
        run: |
          npm test
          npm run test:unit
      - name: Build package
        run: npm run build

  build-example:
    name: Built modules in Node and bundled for Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 27.0.0-nightly20261006fcfb7ecc0b
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/build/package-lock.json
      - name: Install dependencies and build wasmati
        run: |
          npm ci
          npm run build
          npm ci --prefix examples/build
      # Builds the example, runs it in Node, and bundles it with Vite and webpack for headless Chrome.
      - name: Test the example
        run: npm test --prefix examples/build
        env:
          CHROME: google-chrome

  publish:
    name: Publish version bump to npm
    needs: [format, check, build-example]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 27.0.0-nightly20261006fcfb7ecc0b
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check for an unpublished version bump
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/check-release.ts
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci
      - name: Publish with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
