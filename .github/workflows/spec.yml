name: Experimental spec tests

on:
  push:
    branches: [main, text-codecs]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Spec (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # The full suite records the current failures while support is being implemented.
    continue-on-error: ${{ matrix.suite == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [integers, full]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WebAssembly/spec
          # wg-3.0; keep the corpus fixed while iterating on the parser and API.
          ref: 9d36019973201a19f9c9ebb0f10828b2fe2374aa
          path: .spec-tests
      - uses: actions/setup-node@v7
        with:
          node-version: 27.0.0-nightly20261006fcfb7ecc0b
          cache: npm
      - run: npm ci
      - name: Run assertions through generated wasmati code
        shell: bash
        run: |
          if [[ '${{ matrix.suite }}' == 'integers' ]]; then
            npm run test:spec -- .spec-tests/test/core/i32.wast .spec-tests/test/core/i64.wast > spec-results.txt 2>&1
          else
            npm run test:spec -- .spec-tests > spec-results.txt 2>&1
          fi
      - name: Report results
        if: always()
        run: tail -n 1 spec-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spec-results-${{ matrix.suite }}
          path: spec-results.txt
          retention-days: 7
