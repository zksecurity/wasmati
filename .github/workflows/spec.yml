name: Spec tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Spec tests through wasmati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WebAssembly/spec
          # wg-3.0; the baseline records how many assertions pass per file at this revision.
          ref: 9d36019973201a19f9c9ebb0f10828b2fe2374aa
          path: .spec-tests
      - uses: actions/setup-node@v7
        with:
          node-version: 27.0.0-nightly20261006fcfb7ecc0b
          cache: npm
      - run: npm ci
      - name: Run assertions and compare with the baseline
        run: npm run test:spec -- .spec-tests --baseline src/test/spec-baseline.json > spec-results.txt 2>&1
      - name: Report results
        if: always()
        run: grep -E "^(Regression|Spec assertions|[0-9]+ files improved)" spec-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spec-results
          path: spec-results.txt
          retention-days: 7
